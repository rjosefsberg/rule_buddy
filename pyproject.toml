[project]
name = "rule-buddy"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pymupdf>=1.28.2",
]

[project.scripts]
rulebuddy = "rulebuddy.__main__:main"

[dependency-groups]
# Only needed to make the drive folder. uv sync prunes whatever is not
# declared, and it took PyInstaller out twice.
build = ["pyinstaller>=6.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulebuddy"]
