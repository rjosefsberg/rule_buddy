<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rule Buddy</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<aside id="shelf">
    <div class="shelf-head">
        <span class="shelf-title">Books</span>
        <button class="shelf-toggle" id="shelf-toggle" title="Hide the shelf">‹</button>
    </div>
    <div class="shelf-body" id="shelf-body"></div>
    <div class="shelf-body" id="collections"></div>
</aside>

<div id="main">
    <div id="bar">
        <div class="tabs">
            <button class="tab on" data-view="search">Search</button>
            <button class="tab" data-view="ask">Ask</button>
            <button class="tab" data-view="library">Charm Library</button>
            <button class="tab" data-view="bookmarks">Bookmarks</button>
            <button class="tab" data-view="import">Import</button>
        </div>
        <span id="collection"></span>
        <button id="key-btn" title="The API key for written answers">Key…</button>
        <button id="text-smaller" title="Smaller text (Ctrl and minus)">A−</button>
        <button id="text-bigger" title="Bigger text (Ctrl and plus)">A+</button>
    </div>

    <div id="panes">
        <div id="left">
            <!-- search view -->
            <div class="view" data-view="search">
                <form class="field" id="search-form">
                    <input type="search" id="terms" placeholder="Ask the book…"
                           autocomplete="off" spellcheck="false">
                    <button class="primary" type="submit">Search</button>
                </form>
                <div class="list-wrap">
                    <table class="rows">
                        <thead><tr>
                            <th style="width:34%">Book</th>
                            <th>Section</th>
                            <th style="width:74px">Page</th>
                        </tr></thead>
                        <tbody id="results"></tbody>
                    </table>
                </div>
                <div class="field">
                    <button id="open-pdf">Open the PDF at this page</button>
                </div>
            </div>

            <!-- ask view -->
            <div class="view hidden" data-view="ask">
                <div id="transcript"></div>
                <form class="field" id="ask-form">
                    <textarea id="question" rows="3" placeholder="Ask the book…"
                              spellcheck="false"></textarea>
                </form>
                <div class="field">
                    <span class="hint" id="ask-hint">Enter asks · Shift+Enter adds a line</span>
                    <button type="button" id="ask-clear">Clear</button>
                    <button type="button" id="ask-more">Ask more</button>
                    <button type="button" class="primary" id="ask-new">New question</button>
                </div>
                <div class="list-wrap" id="ask-sources-wrap">
                    <table class="rows">
                        <thead><tr>
                            <th style="width:34%">Book</th>
                            <th>Section</th>
                            <th style="width:74px">Page</th>
                        </tr></thead>
                        <tbody id="ask-sources"></tbody>
                    </table>
                </div>
            </div>

            <!-- library view -->
            <div class="view hidden" data-view="library">
                <form class="field" id="charm-form">
                    <input type="search" id="charm-terms" placeholder="Find a Charm…"
                           autocomplete="off" spellcheck="false">
                    <button class="primary" type="submit">Find</button>
                    <button type="button" id="charm-clear">Clear</button>
                </form>
                <div class="filters">
                    <label>Book <select id="f-book"></select></label>
                    <label>Tree <select id="f-tree"></select></label>
                    <label>Type <select id="f-type"></select></label>
                    <label>Keyword <select id="f-keyword"></select></label>
                    <label>Essence up to <select id="f-essence"></select></label>
                </div>
                <div class="list-wrap">
                    <table class="rows">
                        <thead><tr>
                            <th>Charm</th>
                            <th style="width:26%">Tree</th>
                            <th style="width:86px">Cost</th>
                            <th style="width:52px">Ess</th>
                            <th style="width:64px">Page</th>
                        </tr></thead>
                        <tbody id="charm-rows"></tbody>
                    </table>
                </div>
                <div class="field">
                    <button id="charm-build">Build the library</button>
                    <button id="charm-open">Open the PDF at this page</button>
                </div>
            </div>

            <!-- bookmark editor -->
            <div class="view hidden" data-view="bookmarks">
                <div class="field">
                    <input type="text" id="bm-path" placeholder="Open a PDF. Any PDF will do."
                           readonly>
                    <button type="button" id="bm-open">Open…</button>
                </div>
                <div class="field">
                    <button type="button" id="bm-read">Read the PDF's bookmarks</button>
                    <span class="hint">or contents page(s)</span>
                    <input type="text" id="bm-pages" placeholder="4, 5, 8-11"
                           style="flex:0 0 140px">
                    <button type="button" id="bm-parse">Read</button>
                </div>
                <div class="list-wrap">
                    <table class="rows">
                        <thead><tr>
                            <th>Title</th>
                            <th style="width:80px">Page</th>
                        </tr></thead>
                        <tbody id="bm-rows"></tbody>
                    </table>
                </div>
                <div class="field">
                    <button type="button" id="bm-rename">Rename…</button>
                    <button type="button" id="bm-out">◀ Out</button>
                    <button type="button" id="bm-in">In ▶</button>
                    <button type="button" id="bm-page">Set page…</button>
                    <button type="button" id="bm-add">Add…</button>
                    <button type="button" id="bm-del">Delete</button>
                    <span class="hint"></span>
                    <button type="button" class="primary" id="bm-save">Save to PDF</button>
                </div>
            </div>

            <!-- folder import -->
            <div class="view hidden" data-view="import">
                <div class="field">
                    <input type="text" id="im-folder" placeholder="Pick a folder of PDFs."
                           readonly>
                    <button type="button" id="im-browse">Browse…</button>
                </div>
                <div class="field">
                    <label class="hint" style="flex:0 0 auto">
                        <input type="checkbox" id="im-deep"> Look in subfolders</label>
                    <button type="button" id="im-check">Check the PDFs</button>
                    <span class="hint" id="im-count"></span>
                </div>
                <div class="list-wrap">
                    <table class="rows">
                        <thead><tr>
                            <th style="width:40%">Book</th>
                            <th style="width:70px">Pages</th>
                            <th>Verdict</th>
                        </tr></thead>
                        <tbody id="im-rows"></tbody>
                    </table>
                </div>
                <div class="field">
                    <span class="hint" style="flex:0 0 auto">Collection name</span>
                    <input type="text" id="im-name">
                    <button type="button" class="primary" id="im-index" disabled>
                        Index the good books</button>
                </div>
            </div>
        </div>

        <div id="sash"></div>

        <div id="right">
            <div id="excerpt" class="view" data-view="search ask"></div>
            <div id="charm-detail" class="view hidden" data-view="library"
                 style="flex:1;min-height:0;overflow-y:auto;margin:var(--gap);
                        padding:22px 26px;background:var(--paper);
                        color:var(--paperink);border-radius:var(--radius)"></div>
        </div>
    </div>

    <div id="status">Starting…</div>
</div>

<div id="book-menu" class="menu hidden">
    <button data-do="rename">Rename…</button>
    <button data-do="find" class="hidden">Find the PDF…</button>
    <button data-do="add">Add a book to this collection…</button>
    <button data-do="reimport">Reimport from the PDF…</button>
    <button data-do="remove">Remove this book…</button>
</div>

<dialog id="key-box">
    <form method="dialog">
        <p>Anthropic API key. It buys written answers; search needs no key.</p>
        <input type="password" id="key-value" autocomplete="off"
               placeholder="sk-ant-…">
        <label class="hint" style="display:flex;gap:6px;padding-top:10px">
            <input type="checkbox" id="key-save"> Save it to config.json</label>
        <div class="field" style="padding:12px 0 0;justify-content:flex-end">
            <button value="">Cancel</button>
            <button value="drop" id="key-drop">Remove the key</button>
            <button class="primary" value="ok">Use this key</button>
        </div>
    </form>
</dialog>

<dialog id="ask-line">
    <form method="dialog">
        <p id="ask-line-prompt"></p>
        <input type="text" id="ask-line-value" autocomplete="off">
        <div class="field" style="padding:12px 0 0;justify-content:flex-end">
            <button value="">Cancel</button>
            <button class="primary" id="ask-line-ok" value="ok">OK</button>
        </div>
    </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
