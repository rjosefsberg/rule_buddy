<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rule Buddy</title>
<link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css">
<link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css">
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<aside id="shelf">
    <div class="shelf-head">
        <span class="shelf-title">Books</span>
        <button class="shelf-toggle" id="shelf-toggle" title="Hide the shelf">‹</button>
    </div>
    <div class="shelf-body" id="collections"></div>
    <div class="shelf-body" id="shelf-body"></div>
</aside>

<div id="main">
    <!-- Tools first: they work on any file, whatever is open. -->
    <div class="bar tools-bar">
        <span class="group">Tools</span>
        <div class="tabs">
            <button class="tab on" data-view="search">Search</button>
            <button class="tab" data-view="bookmarks">Bookmarks</button>
            <button class="tab" data-view="import">Import</button>
        </div>
        <div class="tabs">
            <button class="tab game-menu-btn" id="exalted-menu-btn">Exalted ▾</button>
        </div>
        <span class="spacer"></span>
        <button class="btn btn-outline-secondary btn-sm" id="key-btn" title="The API key for written answers">Key…</button>
        <button class="btn btn-outline-secondary btn-sm" id="text-smaller" title="Smaller text (Ctrl and minus)">A−</button>
        <button class="btn btn-outline-secondary btn-sm" id="text-bigger" title="Bigger text (Ctrl and plus)">A+</button>
    </div>

    <!-- Only shown while the Search tab is open: the collection being read,
         and its own Search/Ask toggle. -->
    <div class="bar book-bar" id="book-bar">
        <span class="group">This collection</span>
        <div class="tabs">
            <button class="tab on" data-view="search">Search</button>
            <button class="tab" data-view="ask">Ask</button>
        </div>
        <span id="collection"></span>
    </div>

    <div id="panes">
        <div id="left">
            <!-- search view -->
            <div class="view" data-view="search">
                <form class="field" id="search-form">
                    <input class="form-control" type="search" id="terms" placeholder="Ask the book…"
                           autocomplete="off" spellcheck="false">
                    <button class="btn btn-primary primary" type="submit">Search</button>
                </form>
                <div class="list-wrap">
                    <table class="rows">
                        <thead><tr>
                            <th style="width:34%">Book</th>
                            <th>Section</th>
                            <th style="width:74px">Page</th>
                        </tr></thead>
                        <tbody id="results"></tbody>
                    </table>
                </div>
                <div class="field">
                    <button class="btn btn-outline-secondary" id="open-pdf">Open the PDF at this page</button>
                </div>
            </div>

            <!-- ask view -->
            <div class="view hidden" data-view="ask">
                <div id="transcript"></div>
                <form class="field" id="ask-form">
                    <textarea class="form-control" id="question" rows="3" placeholder="Ask the book…"
                              spellcheck="false"></textarea>
                </form>
                <div class="field">
                    <span class="hint" id="ask-hint">Enter asks · Shift+Enter adds a line</span>
                    <button class="btn btn-outline-secondary" type="button" id="ask-clear">Clear</button>
                    <button class="btn btn-outline-secondary" type="button" id="ask-more">Ask more</button>
                    <button class="btn btn-primary primary" type="button" id="ask-new">New question</button>
                </div>
                <div class="list-wrap" id="ask-sources-wrap">
                    <table class="rows">
                        <thead><tr>
                            <th style="width:34%">Book</th>
                            <th>Section</th>
                            <th style="width:74px">Page</th>
                        </tr></thead>
                        <tbody id="ask-sources"></tbody>
                    </table>
                </div>
            </div>

            <!-- library view -->
            <div class="view hidden" data-view="library">
                <div class="field hidden" id="charm-picking-banner"
                     style="background:var(--mark)">
                    <span class="hint" id="charm-picking-label"></span>
                    <span class="spacer"></span>
                    <button class="btn btn-primary primary" type="button" id="charm-picking-done">Done</button>
                </div>
                <form class="field" id="charm-form">
                    <input class="form-control" type="search" id="charm-terms" placeholder="Find a Charm…"
                           autocomplete="off" spellcheck="false">
                    <button class="btn btn-primary primary" type="submit">Find</button>
                    <button class="btn btn-outline-secondary" type="button" id="charm-clear">Clear</button>
                </form>
                <div class="filters">
                    <label>Book <select class="form-select form-select-sm" id="f-book"></select></label>
                    <label>Tree <select class="form-select form-select-sm" id="f-tree"></select></label>
                    <label>Type <select class="form-select form-select-sm" id="f-type"></select></label>
                    <label>Keyword <select class="form-select form-select-sm" id="f-keyword"></select></label>
                    <label>Essence up to <select class="form-select form-select-sm" id="f-essence"></select></label>
                </div>
                <div class="list-wrap">
                    <table class="rows" id="library-table">
                        <thead><tr>
                            <th class="sortable" data-sort="name">Charm<span class="arrow"></span></th>
                            <th class="sortable" data-sort="tree" style="width:22%">Tree<span class="arrow"></span></th>
                            <th style="width:86px">Cost</th>
                            <th style="width:52px">Ess</th>
                            <th class="sortable" data-sort="book" style="width:20%">Book<span class="arrow"></span></th>
                            <th style="width:64px">Page</th>
                        </tr></thead>
                        <tbody id="charm-rows"></tbody>
                    </table>
                </div>
                <div class="field">
                    <button class="btn btn-outline-secondary" id="charm-build">Build the library</button>
                    <button class="btn btn-outline-secondary" id="charm-open">Open the PDF at this page</button>
                    <button class="btn btn-primary primary hidden" id="charm-picking-add">Add to character</button>
                </div>
            </div>

            <!-- characters -->
            <div class="view hidden" data-view="characters">
                <div class="field">
                    <button class="btn btn-primary primary" type="button" id="char-new">New Character</button>
                    <button class="btn btn-outline-secondary" type="button" id="char-delete">Delete</button>
                </div>
                <div class="list-wrap">
                    <table class="rows">
                        <thead><tr>
                            <th>Name</th>
                        </tr></thead>
                        <tbody id="char-rows"></tbody>
                    </table>
                </div>
            </div>

            <!-- bookmark editor -->
            <div class="view hidden" data-view="bookmarks">
                <div class="field">
                    <input class="form-control" type="text" id="bm-path" placeholder="Open a PDF. Any PDF will do."
                           readonly>
                    <button class="btn btn-outline-secondary" type="button" id="bm-open">Open…</button>
                </div>
                <div class="field">
                    <button class="btn btn-outline-secondary" type="button" id="bm-read">Read the PDF's bookmarks</button>
                    <span class="hint">or contents page(s)</span>
                    <input class="form-control" type="text" id="bm-pages" placeholder="4, 5, 8-11"
                           style="flex:0 0 140px">
                    <button class="btn btn-outline-secondary" type="button" id="bm-parse">Read</button>
                </div>
                <div class="list-wrap">
                    <table class="rows">
                        <thead><tr>
                            <th>Title</th>
                            <th style="width:80px">Page</th>
                        </tr></thead>
                        <tbody id="bm-rows"></tbody>
                    </table>
                </div>
                <div class="field">
                    <button class="btn btn-outline-secondary" type="button" id="bm-rename">Rename…</button>
                    <button class="btn btn-outline-secondary" type="button" id="bm-out">◀ Out</button>
                    <button class="btn btn-outline-secondary" type="button" id="bm-in">In ▶</button>
                    <button class="btn btn-outline-secondary" type="button" id="bm-page">Set page…</button>
                    <button class="btn btn-outline-secondary" type="button" id="bm-add">Add…</button>
                    <button class="btn btn-outline-secondary" type="button" id="bm-del">Delete</button>
                    <span class="hint"></span>
                    <button class="btn btn-primary primary" type="button" id="bm-save">Save to PDF</button>
                </div>
            </div>

            <!-- folder import -->
            <div class="view hidden" data-view="import">
                <div class="field">
                    <input class="form-control" type="text" id="im-folder" placeholder="Pick a folder of PDFs."
                           readonly>
                    <button class="btn btn-outline-secondary" type="button" id="im-browse">Browse…</button>
                </div>
                <div class="field">
                    <label class="hint" style="flex:0 0 auto">
                        <input type="checkbox" id="im-deep"> Look in subfolders</label>
                    <button class="btn btn-outline-secondary" type="button" id="im-check">Check the PDFs</button>
                    <span class="hint" id="im-count"></span>
                </div>
                <div class="list-wrap">
                    <table class="rows">
                        <thead><tr>
                            <th style="width:40%">Book</th>
                            <th style="width:70px">Pages</th>
                            <th>Verdict</th>
                        </tr></thead>
                        <tbody id="im-rows"></tbody>
                    </table>
                </div>
                <div class="field">
                    <span class="hint" style="flex:0 0 auto">Collection name</span>
                    <input class="form-control" type="text" id="im-name">
                    <button class="btn btn-primary primary" type="button" id="im-index" disabled>
                        Index the good books</button>
                </div>
            </div>
        </div>

        <div id="sash"></div>

        <div id="right">
            <div id="excerpt" class="view" data-view="search ask"></div>
            <div id="charm-detail" class="view hidden" data-view="library"
                 style="flex:1;min-height:0;overflow-y:auto;margin:var(--gap);
                        padding:22px 26px;background:var(--paper);
                        color:var(--paperink);border-radius:var(--radius)"></div>
            <div id="character-detail" class="view hidden" data-view="characters"
                 style="flex:1;min-height:0;overflow-y:auto;margin:var(--gap);
                        padding:22px 26px;background:var(--paper);
                        color:var(--paperink);border-radius:var(--radius)"></div>
        </div>
    </div>

    <div id="status">Starting…</div>
</div>

<div id="book-menu" class="menu shadow hidden">
    <button data-do="rename">Rename…</button>
    <button data-do="find" class="hidden">Find the PDF…</button>
    <button data-do="add">Add a book to this collection…</button>
    <button data-do="reimport">Reimport from the PDF…</button>
    <button data-do="remove">Remove this book…</button>
</div>

<div id="collection-menu" class="menu shadow hidden">
    <button data-do="rename-collection">Rename this collection…</button>
    <button data-do="delete-collection">Delete this collection…</button>
</div>

<div id="exalted-menu" class="menu shadow hidden">
    <button data-view="library">Charm Library</button>
    <button data-view="characters">Characters</button>
</div>

<div id="charm-known-menu" class="menu shadow hidden">
    <button data-do="view"><i class="fa-solid fa-eye"></i> View</button>
    <button data-do="delete"><i class="fa-solid fa-trash"></i> Delete</button>
</div>

<dialog id="key-box" class="shadow-lg rounded-3">
    <form method="dialog">
        <p>Anthropic API key. It buys written answers; search needs no key.</p>
        <input class="form-control" type="password" id="key-value" autocomplete="off"
               placeholder="sk-ant-…">
        <label class="hint" style="display:flex;gap:6px;padding-top:10px">
            <input type="checkbox" id="key-save"> Save it to config.json</label>
        <div class="field" style="padding:12px 0 0;justify-content:flex-end">
            <button class="btn btn-outline-secondary" type="button" id="key-cancel">Cancel</button>
            <button class="btn btn-outline-secondary" type="button" id="key-drop">Remove the key</button>
            <button class="btn btn-primary primary" value="ok">Use this key</button>
        </div>
    </form>
</dialog>

<dialog id="ask-line" class="shadow-lg rounded-3">
    <form method="dialog">
        <p id="ask-line-prompt"></p>
        <input class="form-control" type="text" id="ask-line-value" autocomplete="off">
        <div class="field" style="padding:12px 0 0;justify-content:flex-end">
            <button class="btn btn-outline-secondary" type="button" id="ask-line-cancel">Cancel</button>
            <button class="btn btn-primary primary" id="ask-line-ok" value="ok">OK</button>
        </div>
    </form>
</dialog>

<dialog id="charm-view" class="shadow-lg rounded-3" style="max-width:640px;width:90%">
    <div id="charm-view-body"></div>
    <div class="field" style="padding:14px 0 0;justify-content:flex-end">
        <form method="dialog"><button class="btn btn-primary primary">Close</button></form>
    </div>
</dialog>

<script src="characters-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
